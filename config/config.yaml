# =====================================================================
# Configuracion del pipeline. Todo lo ajustable vive aqui.
# Valores tomados de tu runBITACORA.sh real (Mtub H37Rv).
# =====================================================================

# ---- BITACORA ----
# Carpeta "Scripts" de tu instalacion de BITACORA
bitacora_scriptdir: "/users-d2/j.rondon/arsR/SSNs_results_PAPER/bitacora_results/bitacora_SSN_Jun26/Scripts"

# Carpeta de FPDBs (una por familia: <FPDB>_db.fasta + <FPDB>_db.hmm)
query_db: "/users-d2/j.rondon/arsR/SSNs_results_PAPER/bitacora_results/bitacora_SSN_Jun26/databases"

# jar de GeMoMa: solo se usa si GEMOMA=T. Con GEMOMA=F queda vacio.
bitacora_gemomap: ""

# Parametros de BITACORA (de tu script)
bitacora_threads: 10
bitacora_gemoma: "F"
bitacora_maxintron: 0
bitacora_genomicblastp: "F"
bitacora_addfilter: "T"
bitacora_filterlength: 60
bitacora_retainnonfilter: "F"
bitacora_clean: "T"

# Sufijo de los archivos de BITACORA que usas (proteinas completas mejor anotadas)
bitacora_keep_suffix: "_genomic_and_annotated_proteins_trimmed_idseqsclustered"

# ---- MetalNet2 ----
# Se usa TU entorno ya funcional por ruta absoluta (no se recrea desde un yaml).
metalnet_python: "/users-d2/j.rondon/miniconda3/envs/metalnet/bin/python"
metalnet_script: "/users-d2/j.rondon/programas/MetalNet2/model/scripts/run_prediction_workflow.py"
metalnet_msa_source: "colabfold"   # requiere internet en el nodo
metalnet_use_gpu: false            # true -> agrega --cuda 1
metalnet_threads: 4

# ---- Analisis / figuras ----
profiles_map: "config/profiles.tsv"
# Definicion de "sitio CHDE". Por defecto SIN filtro (como en tu analisis original).
# Para endurecer: subir min_prob (p.ej. 0.5) y/o poner require_graph_filter: true
metalnet_min_prob: 0.0
metalnet_require_graph_filter: true
